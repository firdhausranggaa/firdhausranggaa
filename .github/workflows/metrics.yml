name: Metrics
on:
  # Jalan otomatis tiap hari jam 00:00 UTC
  schedule:
    - cron: "0 0 * * *"
  # Bisa dijalankan manual dari tab Actions
  workflow_dispatch:
  # Jalan juga setiap kali push ke branch utama
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          # Gabungan pengganti: header+stats, top languages, dan kalender aktivitas
          base: "header, activity, community, repositories"
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          plugin_calendar: yes
          plugin_calendar_limit: 52